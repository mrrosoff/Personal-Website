name: Install
description: Set up Node and restore node_modules, installing only when the lockfile changed

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"

    - name: Cache Node Modules
      id: modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

    - name: Install Node Modules
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
